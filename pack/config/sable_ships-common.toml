[helm]
	#Base helm thrust force before mass and physics timestep scaling.
	# Default: 10.0
	# Range: 0.1 ~ 1000.0
	baseThrust = 0.1
	#Base helm turn force before mass and physics timestep scaling.
	# Default: 30.0
	# Range: 0.1 ~ 1000.0
	turnForce = 30.0
	#Base forward speed cap while the ship footprint touches water.
	# Default: 6.0
	# Range: 0.1 ~ 1000.0
	waterSpeedCap = 30.0
	#Base forward speed cap when the ship is not detected on water.
	# Default: 3.0
	# Range: 0.1 ~ 1000.0
	landSpeedCap = 3.0

[ship_engine]
	#Extra helm thrust force added by each powered Ship Engine.
	# Default: 6.0
	# Range: 0.1 ~ 1000.0
	thrustBonus = 0.1
	#Extra water speed cap added by each powered Ship Engine.
	# Default: 3.5
	# Range: 0.1 ~ 1000.0
	waterSpeedCapBonus = 0.1
	#Maximum powered Ship Engines that can boost one helm.
	# Default: 32
	# Range: 1 ~ 64
	maxStackingEngines = 32
	#How often a helm scans its SubLevel for powered Ship Engines.
	# Default: 20
	# Range: 1 ~ 200
	engineScanIntervalTicks = 20
	#When enabled, Ship Engines fuel to consumption scales to Fuel Duration Multiplier Scale.
	fuelDurationMultiplierEnabled = true
	#Ship Engine fuel duration multiplier.
	#1.0 keeps vanilla duration, 2.0 is double of fuel duration and its goes by like this.
	# Default: 3.5
	# Range: 1.0 ~ 64.0
	fuelDurationMultiplier = 3.5

[sync]
	#Maximum helm distance for the pilot HUD and active control state.
	# Default: 10
	# Range: 5 ~ 100
	hudDistanceBlocks = 10
	#Radius around a helm where server telemetry packets may be sent.
	# Default: 64.0
	# Range: 5.0 ~ 512.0
	telemetryRadius = 64.0
	#Minimum interval for non-pilot helm telemetry sync.
	# Default: 20
	# Range: 1 ~ 200
	idleSyncIntervalTicks = 20
	#How often active pilot proximity is rechecked.
	# Default: 10
	# Range: 1 ~ 200
	proximityCheckIntervalTicks = 10

[stabilization]
	#Simple stabilization strength. This is PID kp: how strongly the ship tries to stand upright.
	#Higher values recover from tilt faster, but too high can make the ship snap or shake.
	# Default: 300.0
	# Range: 0.1 ~ 2000.0
	stabilizationStrength = 300.0
	#Simple stabilization damping. This is PID kd: how much wobble and rotation gets damped.
	#Higher values calm rocking, but too high can make steering feel heavy.
	# Default: 12.0
	# Range: 0.1 ~ 200.0
	stabilizationDamping = 12.0
	#Simple stabilization correction. This is PID ki: slow correction over time; keep it low.
	#Small values help remove long-term lean. Large values can build up and cause oscillation.
	# Default: 3.5
	# Range: 0.1 ~ 50.0
	stabilizationCorrection = 3.5

[assembly]
	#Maximum number of connected blocks a Ship Helm may assemble.
	# Default: 512
	# Range: 1 ~ 32768
	maxBlocks = 4096
	#Block ids that stop connected ship gathering. Fluids and waterlogged blocks are always excluded.
	excludedBlocks = ["minecraft:grass_block", "minecraft:dirt", "minecraft:stone", "minecraft:sand", "minecraft:gravel", "minecraft:water", "minecraft:lava", "minecraft:kelp", "minecraft:seagrass"]

[debug]
	#Debug. Please dont toggle if you dont know what are you doing. This spams so much console log
	debugState = false
